<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Comercial | Tax Group</title>

<style>
:root{
  --bg:#061522;
  --bg2:#081d2d;
  --sidebar:#04111d;
  --sidebar-hover:#0b2538;
  --card:#0b2032;
  --card2:#0e2940;
  --blue:#1687c9;
  --blue2:#28a5eb;
  --blue3:#65c8ff;
  --white:#ffffff;
  --text:#edf7ff;
  --muted:#8faabd;
  --border:rgba(132,190,222,.13);
  --green:#26c58b;
  --orange:#e8a943;
  --red:#e15b67;
  --shadow:0 15px 40px rgba(0,0,0,.25);
}

*{ box-sizing:border-box; }

/* SCROLLBAR CUSTOMIZADA */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,0.15); }
::-webkit-scrollbar-thumb { background: rgba(101,200,255,0.15); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(101,200,255,0.3); }

body{
  margin:0;
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  background: radial-gradient(circle at 80% 0%, rgba(16,112,170,.14), transparent 30%), var(--bg);
  color:var(--text);
}

.app{ display:flex; min-height:100vh; }

/* SIDEBAR */
.sidebar{ width:270px; background: linear-gradient(180deg, #03101b 0%, #041724 100%); border-right:1px solid rgba(255,255,255,.06); color:white; padding:25px 16px; position:fixed; top:0; bottom:0; left:0; overflow-y:auto; transition:width .28s ease; z-index:20; }
.sidebar-toggle{ position:absolute;right:-13px;top:28px;width:28px;height:28px;border-radius:50%; border:1px solid rgba(101,200,255,.22);background:#0a2538;color:#bfe9ff; display:flex;align-items:center;justify-content:center;cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.28);transition:.2s ease;font-size:14px; }
.sidebar-toggle:hover{background:#123b56;transform:scale(1.06)}
body.sidebar-collapsed .sidebar{width:82px}
body.sidebar-collapsed .main{margin-left:82px;width:calc(100% - 82px)}
body.sidebar-collapsed .logo{justify-content:center;padding-left:0;padding-right:0}
body.sidebar-collapsed .logo-text,body.sidebar-collapsed .menu-title,body.sidebar-collapsed .nav span:not(.nav-icon){display:none}
body.sidebar-collapsed .nav{justify-content:center;padding-left:10px;padding-right:10px}
body.sidebar-collapsed .sidebar-toggle{transform:rotate(180deg)}
body.sidebar-collapsed .sidebar-toggle:hover{transform:rotate(180deg) scale(1.06)}

.logo{ display:flex; align-items:center; gap:11px; padding:8px 13px 28px; font-size:21px; font-weight:850; letter-spacing:.4px; }
.logo-mark{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
.logo-text{ line-height:1; }
.logo-sub{ font-size:9px; letter-spacing:2px; opacity:.5; margin-top:5px; }

.menu-title{ font-size:10px; text-transform:uppercase; letter-spacing:1.6px; opacity:.42; margin:22px 13px 9px; font-weight:700; }
.nav{ display:flex; align-items:center; gap:12px; width:100%; border:0; background:transparent; color:#a9c0d0; padding:11px 13px; border-radius:11px; cursor:pointer; font-size:13px; text-align:left; margin-bottom:4px; transition:.18s ease; }
.nav:hover{ background:var(--sidebar-hover); color:white; }
.nav.active{ background: linear-gradient(90deg, rgba(22,135,201,.22), rgba(22,135,201,.08)); color:white; font-weight:700; box-shadow: inset 3px 0 0 var(--blue2); }
.nav-icon{ width:24px; height:24px; display:flex; align-items:center; justify-content:center; flex-shrink:0; border-radius:7px; color:#7fa7bf; }
.nav.active .nav-icon{ color:var(--blue3); }
.nav-icon svg{ width:18px; height:18px; }

/* MAIN */
.main{ margin-left:270px; width:calc(100% - 270px); padding:32px 38px 55px; }

/* TOPBAR */
.topbar{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:25px; }
.title h1{ margin:0; font-size:30px; letter-spacing:-.6px; }
.title p{ margin:7px 0 0; color:var(--muted); font-size:13px; }
.refresh{ border:1px solid var(--border); background:rgba(255,255,255,.035); color:#d8edf9; border-radius:10px; padding:10px 15px; cursor:pointer; font-weight:700; transition:.18s; }
.refresh:hover{ background:rgba(22,135,201,.15); border-color:rgba(22,165,235,.35); }

/* STATUS & PULSE */
@keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(38, 197, 139, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(38, 197, 139, 0); } 100% { box-shadow: 0 0 0 0 rgba(38, 197, 139, 0); } }
.status{ background:rgba(255,255,255,.025); border:1px solid var(--border); border-radius:11px; padding:11px 15px; margin-bottom:19px; font-size:12px; color:var(--muted); display: flex; align-items: center; }
.status strong{ color:var(--green); display: flex; align-items: center; }
.status strong::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--green); border-radius: 50%; margin-right: 8px; animation: pulse-green 2s infinite; }

/* SKELETON */
@keyframes skeleton-loading { 0% { background-color: rgba(255,255,255,0.02); } 50% { background-color: rgba(255,255,255,0.06); } 100% { background-color: rgba(255,255,255,0.02); } }
.skeleton { animation: skeleton-loading 1.5s infinite; border-radius: 8px; }
.skeleton-title { height: 28px; width: 200px; margin-bottom: 15px; }
.skeleton-text { height: 14px; width: 100px; margin-bottom: 8px; }
.skeleton-box { height: 180px; width: 100%; margin-bottom: 20px; border-radius: 15px; }
.skeleton-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }

/* FILTROS */
.filters{ background: linear-gradient(135deg, rgba(255,255,255,.045), rgba(255,255,255,.018)); border:1px solid var(--border); border-radius:15px; padding:17px; display:flex; gap:14px; flex-wrap:wrap; box-shadow:var(--shadow); margin-bottom:24px; }
.filter{ display:flex; flex-direction:column; gap:6px; min-width:175px; }
.filter label{ font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:800; }
.filter select{ border:1px solid var(--border); border-radius:9px; padding:10px 12px; background:#081c2c; color:#eaf6fd; outline:none; }
.filter select:focus{ border-color:var(--blue); }

/* CARDS */
.grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:15px; margin-bottom:24px; }
.card{ background: linear-gradient(145deg, #0c2438, #091d2e); border:1px solid var(--border); border-radius:15px; padding:20px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
.card::after{ content:""; position:absolute; width:80px; height:80px; right:-35px; bottom:-40px; background:rgba(22,135,201,.10); border-radius:50%; }
.card-label{ color:var(--muted); font-size:11px; font-weight:700; }
.card-value{ font-size:30px; font-weight:850; margin-top:8px; color:#f2faff; }
.card-sub{ margin-top:7px; font-size:11px; color:var(--muted); }

/* SECTIONS */
.section{ background: linear-gradient(145deg, #0b2133, #091b2b); border:1px solid var(--border); border-radius:17px; padding:23px; box-shadow:var(--shadow); margin-bottom:24px; }
.section-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.section-head h2{ margin:0; font-size:18px; letter-spacing:-.2px; }

/* ESTEIRA COMERCIAL */
.pipeline-executive{ display:flex; flex-direction:column; align-items:stretch; gap:0; max-width:850px; margin:0 auto; }
.pipeline-step{ display:flex; align-items:center; gap:18px; padding:18px 22px; background: linear-gradient(135deg, rgba(255,255,255,.035), rgba(255,255,255,.015)); border:1px solid var(--border); border-radius:14px; transition:.18s ease; }
.pipeline-step:hover{ border-color:rgba(40,165,235,.28); transform:translateX(2px); }
.pipeline-step-icon{ width:48px; height:48px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:12px; background:rgba(22,135,201,.12); color:var(--blue3); }
.pipeline-step-icon svg{ width:23px; height:23px; }
.pipeline-step-info{ flex:1; }
.pipeline-step-label{ color:var(--muted); font-size:11px; font-weight:750; text-transform:uppercase; letter-spacing:.7px; }
.pipeline-step-value{ font-size:30px; font-weight:900; line-height:1.1; margin-top:4px; }
.pipeline-step-description{ color:var(--muted); font-size:11px; margin-top:4px; }
.pipeline-connector{ display:flex; align-items:center; gap:13px; margin:5px 0; padding-left:22px; min-height:43px; }
.pipeline-arrow{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(22,135,201,.10); border:1px solid rgba(40,165,235,.15); color:var(--blue3); font-size:18px; font-weight:800; }
.pipeline-conversion{ display:flex; align-items:center; gap:8px; font-size:11px; }
.pipeline-conversion strong{ color:var(--green); font-size:13px; }
.pipeline-conversion span{ color:var(--muted); }

/* RANKING */
.ranking{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.rank{ border:1px solid var(--border); border-radius:13px; padding:16px; display:flex; align-items:center; gap:14px; background:rgba(255,255,255,.018); }
.rank-position{ font-size:25px; font-weight:900; color:var(--blue3); }
.rank-name{ font-weight:800; }
.rank-value{ color:var(--muted); font-size:11px; margin-top:3px; }

/* ==========================================
   CSS DEFINITIVO - AVATARES (MATEMÁTICA PURA, ZERO GAMBIARRA)
========================================== */
.avatar, .consultant-goal-avatar {
  width: 46px; 
  height: 46px; 
  border-radius: 50%; 
  background: linear-gradient(145deg, #123b56, #0a2538);
  border: 1px solid rgba(101,200,255,.18);
  display: flex; 
  align-items: center; 
  justify-content: center;
  font-size: 22px; 
  overflow: hidden; 
  flex-shrink: 0;
  position: relative; /* Essencial para o cálculo matemático funcionar */
}

/* Base cravada para a imagem - Alta fidelidade */
.avatar img, .consultant-goal-avatar img {
  position: absolute;
  display: block;
  max-width: none;
  max-height: none;
  object-fit: cover;
  image-rendering: high-quality;
}

/* Matheus: Precisa de 150% de zoom para tirar o terno. 
   Centralizado: (100 - 150) / 2 = -25% left. */
.avatar img.matheus, .consultant-goal-avatar img.matheus {
  width: 150%; 
  height: 150%; 
  left: -25%; 
  top: -5%; 
}

/* Edson: Precisa de 170% de zoom. 
   Centralizado: (100 - 170) / 2 = -35% left. */
.avatar img.edson, .consultant-goal-avatar img.edson {
  width: 170%; 
  height: 170%; 
  left: -35%; 
  top: -15%;
}

/* Gabriel: Foto muito de longe, precisa de 200% de zoom. 
   Centralizado: (100 - 200) / 2 = -50% left. */
.avatar img.gabriel, .consultant-goal-avatar img.gabriel {
  width: 200%; 
  height: 200%; 
  left: -50%; 
  top: -15%; 
}

/* METAS NA VISÃO DE TUDO */
.goals-section{margin-bottom:22px}
.goals-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:15px}
.goals-kicker{display:flex;align-items:center;gap:7px;color:#69caff;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px}
.goals-kicker-dot{width:6px;height:6px;border-radius:50%;background:#42c8ff;box-shadow:0 0 12px rgba(66,200,255,.8)}
.goals-title-wrap h2{margin:0;font-size:19px;letter-spacing:-.3px}
.goals-subtitle{margin-top:6px;color:var(--muted);font-size:11px}
.goal-controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.goal-period-switch{display:flex;gap:3px;padding:4px;border:1px solid rgba(101,200,255,.13);border-radius:12px;background:rgba(0,0,0,.18)}
.goal-period-btn{border:0;border-radius:8px;padding:8px 12px;background:transparent;color:#7f9bad;font-size:10px;font-weight:850;cursor:pointer;transition:.18s ease}
.goal-period-btn:hover{color:#dff6ff}
.goal-period-btn.active{color:#fff;background:linear-gradient(135deg,#1179b7,#1a9bdc);box-shadow:0 5px 15px rgba(22,135,201,.22)}
.goal-period-select{border:1px solid rgba(101,200,255,.13);border-radius:10px;padding:9px 11px;min-width:155px;background:#071a2a;color:#dff4ff;outline:none;font-size:10px;font-weight:700}
.goal-context{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:10px 13px;margin-bottom:13px;border:1px solid rgba(101,200,255,.09);border-radius:11px;background:linear-gradient(90deg,rgba(22,135,201,.08),rgba(255,255,255,.015))}
.goal-context-period{display:flex;align-items:center;gap:9px;color:#dff4ff;font-size:11px;font-weight:800}.goal-context-period span{color:var(--muted);font-weight:600}.goal-context-status{color:#6f8da0;font-size:9px;text-transform:uppercase;letter-spacing:1px;font-weight:850}
.team-goals-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));gap:13px}
.goal-card{position:relative;overflow:hidden;min-height:190px;background:radial-gradient(circle at 100% 0%,rgba(54,183,240,.13),transparent 36%),linear-gradient(145deg,#0e2b43,#071a2a);border:1px solid rgba(101,200,255,.12);border-radius:16px;padding:16px;box-shadow:var(--shadow);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.goal-card:hover{transform:translateY(-2px);border-color:rgba(101,200,255,.25);box-shadow:0 18px 45px rgba(0,0,0,.30)}
.goal-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#6bd2ff,#1687c9)}
.goal-card.goal-achieved{border-color:rgba(38,197,139,.28);background:radial-gradient(circle at 100% 0%,rgba(38,197,139,.14),transparent 38%),linear-gradient(145deg,#0c2e3c,#071d2a)}
.goal-card.goal-achieved:before{background:linear-gradient(180deg,#67e8b5,#26c58b)}
.goal-card.goal-elite{border-color:rgba(101,200,255,.38);box-shadow:0 0 0 1px rgba(101,200,255,.05),0 18px 50px rgba(22,135,201,.18)}
.goal-card.goal-elite:before{background:linear-gradient(180deg,#d7f5ff,#2eaee8)}
.goal-card.goal-elite:after{content:"";position:absolute;width:140px;height:140px;right:-70px;top:-70px;border-radius:50%;border:1px solid rgba(101,200,255,.13);box-shadow:0 0 40px rgba(101,200,255,.12)}
.goal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.goal-label{font-size:12px;font-weight:850;color:#e4f7ff}.goal-period{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:#6f8fa2;margin-top:4px}
.goal-percent-badge{min-width:52px;height:34px;padding:0 8px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(22,135,201,.10);border:1px solid rgba(101,200,255,.12);color:#72d2ff;font-size:12px;font-weight:950}
.goal-achieved .goal-percent-badge{background:rgba(38,197,139,.10);border-color:rgba(38,197,139,.20);color:#62e7b0}.goal-elite .goal-percent-badge{background:rgba(101,200,255,.12);border-color:rgba(101,200,255,.25);color:#bcecff;box-shadow:0 0 18px rgba(101,200,255,.12)}
.goal-numbers{display:flex;align-items:baseline;gap:6px;margin:16px 0 11px}.goal-current{font-size:27px;line-height:1;font-weight:950;letter-spacing:-1px}.goal-target{color:#718fa1;font-size:10px;font-weight:650}
.goal-progress-wrap{position:relative;padding-top:13px}.goal-bar{height:9px;border-radius:99px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.045);overflow:hidden}.goal-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#1687c9,#55c8ff);box-shadow:0 0 17px rgba(40,165,235,.28);transition:width .55s cubic-bezier(.22,.8,.25,1)}.goal-achieved .goal-fill{background:linear-gradient(90deg,#20ad7c,#62e7b0);box-shadow:0 0 17px rgba(38,197,139,.22)}.goal-elite .goal-fill{background:linear-gradient(90deg,#2aa8df,#c4efff);box-shadow:0 0 20px rgba(101,200,255,.36)}
.goal-milestones{position:absolute;left:0;right:0;top:0;height:20px}.goal-milestone{position:absolute;top:6px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#18364a;border:2px solid #0b2133;box-shadow:0 0 0 1px rgba(101,200,255,.12)}.goal-milestone.done{background:#5ccfff;box-shadow:0 0 0 2px rgba(92,207,255,.08),0 0 9px rgba(92,207,255,.5)}.goal-milestone-label{position:absolute;top:-7px;transform:translate(-50%,-100%);color:#55788d;font-size:8px;font-weight:800}.goal-milestone.done .goal-milestone-label{color:#8fdcff}
.goal-reward{display:flex;align-items:center;gap:8px;min-height:43px;margin-top:12px;padding:8px 9px;border:1px solid rgba(255,255,255,.055);border-radius:10px;background:rgba(0,0,0,.13);color:#718e9f;font-size:9px;line-height:1.25}.goal-reward-icon{width:25px;height:25px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:7px;background:rgba(255,255,255,.04);color:#5c7b8c;font-size:12px}.goal-reward strong{display:block;margin-top:2px;color:#a7c0ce;font-size:9px}.goal-reward.unlocked{border-color:rgba(38,197,139,.15);background:linear-gradient(90deg,rgba(38,197,139,.075),rgba(255,255,255,.02));color:#89bca9}.goal-reward.unlocked .goal-reward-icon{background:rgba(38,197,139,.12);color:#60e5ad;box-shadow:0 0 15px rgba(38,197,139,.12)}.goal-reward.unlocked strong{color:#6ce9b3}.goal-reward.elite{border-color:rgba(101,200,255,.25);background:linear-gradient(90deg,rgba(22,135,201,.13),rgba(101,200,255,.04))}.goal-reward.elite .goal-reward-icon{background:rgba(101,200,255,.12);color:#9be2ff;box-shadow:0 0 18px rgba(101,200,255,.18)}.goal-reward.elite strong{color:#a6e5ff}
.individual-goals{margin-top:18px}.individual-goals-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.individual-goals-head h3{margin:0;font-size:13px}.individual-goals-head span{color:var(--muted);font-size:10px}.individual-goals-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.consultant-goal-card{background:linear-gradient(145deg,#0b2336,#071925);border:1px solid var(--border);border-radius:15px;padding:15px;box-shadow:var(--shadow);min-width:0}.consultant-goal-card.selected{border-color:rgba(101,200,255,.35);box-shadow:0 0 0 1px rgba(101,200,255,.06),var(--shadow)}.consultant-goal-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,.055)}.consultant-goal-name{font-size:12px;font-weight:900}.consultant-goal-role{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px}.mini-goal{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.045)}.mini-goal:last-child{border-bottom:0;padding-bottom:1px}.mini-goal-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.mini-goal-name{font-size:9px;color:#cfe4ef;font-weight:750}.mini-goal-percent{font-size:9px;color:#6fcaef;font-weight:900}.mini-goal-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}.mini-goal-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#1687c9,#65c8ff)}.mini-goal-fill.done{background:linear-gradient(90deg,#20ad7c,#62e7b0)}.mini-goal-fill.elite{background:linear-gradient(90deg,#2aa8df,#c4efff);box-shadow:0 0 9px rgba(101,200,255,.25)}.mini-goal-values{display:flex;justify-content:space-between;margin-top:4px;color:#617f91;font-size:8px}.mini-goal-values strong{color:#9eb8c7}
.overview-page .section{margin-bottom:20px}
@media(max-width:1200px){.goals-head{align-items:flex-start;flex-direction:column}.goal-controls{justify-content:flex-start}.individual-goals-grid{grid-template-columns:1fr}}
@media(max-width:800px){.goal-controls{width:100%}.goal-period-switch{width:100%}.goal-period-btn{flex:1}.goal-period-select{width:100%}.goal-context{align-items:flex-start;flex-direction:column}}

/* STAGE CARDS */
.stage-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:17px; }
.stage-card{ background: linear-gradient(145deg, #0d263a, #091c2d); border:1px solid var(--border); border-radius:16px; padding:23px; box-shadow:var(--shadow); transition: transform .18s, border-color .18s; }
.stage-card:hover{ transform:translateY(-2px); border-color:rgba(40,165,235,.28); }
.stage-icon{ width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; background:rgba(22,135,201,.12); color:var(--blue3); }
.stage-icon svg{ width:21px; height:21px; }
.stage-card h3{ margin:15px 0 4px; font-size:13px; }
.stage-number{ font-size:37px; font-weight:900; color:#f3fbff; }
.stage-conversion{ margin-top:14px; background:rgba(38,197,139,.055); border:1px solid rgba(38,197,139,.10); border-radius:9px; padding:10px; font-size:11px; color:var(--muted); }
.stage-conversion strong{ color:var(--green); }

/* TABELA STICKY */
.table-wrap{ max-height: 500px; overflow-y: auto; border-radius: 8px; }
table{ width:100%; border-collapse:collapse; }
th,td{ text-align:left; padding:12px; border-bottom:1px solid var(--border); }
th{ position: sticky; top: 0; background: var(--card2); z-index: 10; font-size:10px; text-transform:uppercase; color:var(--muted); box-shadow: 0 1px 0 var(--border); }

/* EMPTY */
.empty{ padding:60px; text-align:center; color:var(--muted); }

/* RESPONSIVO */
@media(max-width:1100px){ .grid{ grid-template-columns:repeat(2,1fr); } .stage-grid{ grid-template-columns:repeat(2,1fr); } }
@media(max-width:800px){
  .sidebar{ width:78px; }
  .logo-text, .logo-sub, .menu-title{ display:none; }
  .logo{ justify-content:center; }
  .nav{ justify-content:center; }
  .nav span:not(.nav-icon){ display:none; }
  .main{ margin-left:78px; width:calc(100% - 78px); padding:20px; }
  .grid, .stage-grid, .ranking, .goals-grid{ grid-template-columns:1fr; }
}
@media(max-width:700px){ .pipeline-executive{ width:100%; } .pipeline-step{ padding:15px; } .pipeline-connector{ padding-left:15px; } }
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
  <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Recolher menu" title="Recolher menu">‹</button>
  <div class="logo">

      <img src="assets/logo.png" alt="Logo Tax Group" style="width: 100%; height: 100%; object-fit: contain;">
    </div>
    <div class="logo-text">TAX GROUP<div class="logo-sub">COMERCIAL</div></div>
  </div>

  <div class="menu-title">Dashboard</div>
  <button class="nav active" data-page="overview">
    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
    <span>Visão de Tudo</span>
  </button>

  <div class="menu-title">Esteira Comercial</div>
  <button class="nav" data-page="prospeccao"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><circle cx="11" cy="11" r="2"/><path d="M16 16l5 5"/></svg></span><span>Prospecção Inicial</span></button>
  <button class="nav" data-page="diagnostico"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/><path d="M8 11l2 2 5-5"/></svg></span><span>Diagnóstico Estratégico</span></button>
  <button class="nav" data-page="validacao"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3z"/><path d="M8 12l2.5 2.5L16 9"/></svg></span><span>Validação Executiva</span></button>
  <button class="nav" data-page="apresentacao"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 13l3-3 2 2 4-5"/></svg></span><span>Apresentação Executiva</span></button>
  <button class="nav" data-page="decisorio"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M9 6h3c3 0 3 3 3 5v4"/><path d="M12 12l3 3 3-3"/></svg></span><span>Processo Decisório</span></button>

  <div class="menu-title">Gestão</div>
  <button class="nav" data-page="metas"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l3-4 3 2 5-7"/></svg></span><span>Metas</span></button>
  <button class="nav" data-page="consultores"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-4 2.5-6 6-6s6 2 6 6"/><path d="M15 14c3.5 0 6 2 6 6"/></svg></span><span>Consultores</span></button>
</aside>

<!-- MAIN -->
<main class="main" id="app">
  <div class="empty">
    <div class="skeleton skeleton-title"></div>
    <div class="skeleton skeleton-text"></div>
    <div class="skeleton skeleton-text"></div>
  </div>
</main>
</div>

<script>
/* =====================================================
   GOOGLE SHEETS & ESTADO GLOBAL
===================================================== */
const PUBLISHED_ID = "2PACX-1vTag39UjwjAd6j3ypuq42D_wtFAqGzhwup9mkbgllj5ZrQnpl-u36zt7Si9fV2OjZSDYscQ1DTLSWuJ";
const SHEETS = { lancamentos: "541100022", metas: "1903840577" };

let lancamentos = [];
let metas = [];
let currentPage = "overview";

let filters = { month:"all", week:"all", segment:"all", consultant:"all" };
let goalFilters = { periodicity:"mensal", period:"all" };

/* NORMALIZAÇÃO E PARSERS */
function normalizeText(value){
  return String(value ?? "").replace(/\uFEFF/g,"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim().toLowerCase();
}
function normalizeHeader(value){ return normalizeText(value); }
function csvUrl(gid){ return "https://docs.google.com/spreadsheets/d/e/" + PUBLISHED_ID + "/pub?output=csv&gid=" + gid; }
function parseCSV(text){
  const rows=[]; let row=[]; let cell=""; let insideQuotes=false;
  for(let i=0; i<text.length; i++){
    const char=text[i]; const next=text[i+1];
    if(char === '"' && insideQuotes && next === '"'){ cell+='"'; i++; continue; }
    if(char === '"'){ insideQuotes=!insideQuotes; continue; }
    if(char === "," && !insideQuotes){ row.push(cell); cell=""; continue; }
    if((char === "\n" || char === "\r") && !insideQuotes){
      if(char === "\r" && next === "\n") i++;
      row.push(cell); cell="";
      if(row.some(x => String(x).trim() !== "")) rows.push(row);
      row=[]; continue;
    }
    cell+=char;
  }
  if(cell !== "" || row.length){ row.push(cell); if(row.some(x => String(x).trim() !== "")) rows.push(row); }
  return rows;
}
function rowsToObjects(rows){
  if(!rows.length) return [];
  const headers = rows[0].map(normalizeHeader);
  return rows.slice(1).map(row=>{
      const obj={};
      headers.forEach((header,index)=>{ obj[header]=String(row[index] ?? "").replace(/\uFEFF/g,"").trim(); });
      return obj;
  });
}

/* CARREGAMENTO */
async function loadSheet(gid){
  const response = await fetch(csvUrl(gid) + "&cachebust=" + Date.now());
  if(!response.ok) throw new Error("Erro HTTP " + response.status);
  const text = await response.text();
  if(text.includes("<!DOCTYPE html>") || text.includes("<html")) throw new Error("O Google retornou HTML em vez do CSV.");
  return rowsToObjects(parseCSV(text));
}
async function loadData(){
  const app = document.getElementById("app");
  app.innerHTML=`<div style="margin-bottom: 25px;"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width: 150px;"></div></div><div class="skeleton-grid"><div class="skeleton skeleton-box"></div><div class="skeleton skeleton-box"></div><div class="skeleton skeleton-box"></div><div class="skeleton skeleton-box"></div></div><div class="skeleton skeleton-box" style="height: 300px;"></div>`;
  try{ lancamentos = await loadSheet(SHEETS.lancamentos); metas = await loadSheet(SHEETS.metas); render(); }
  catch(error){ console.error(error); app.innerHTML=`<div class="empty"><h2>Erro ao carregar a planilha</h2><p>${escapeHTML(error.message)}</p><br><button class="refresh" onclick="loadData()">Tentar novamente</button></div>`; }
}

/* DATAS E VALORES */
function parseDate(value){
  if(!value) return null; value=String(value).trim();
  if(value.includes("/")){ const p=value.split("/"); if(p.length===3){ const d=new Date(Number(p[2]), Number(p[1])-1, Number(p[0])); if(!isNaN(d.getTime())) return d; } }
  if(value.includes("-")){ const p=value.split("-"); if(p.length===3){ const d=new Date(Number(p[0]), Number(p[1])-1, Number(p[2])); if(!isNaN(d.getTime())) return d; } }
  const date=new Date(value); return isNaN(date.getTime()) ? null : date;
}
function startOfWeek(date){ const d=new Date(date); const day=d.getDay(); const diff = day===0 ? -6 : 1-day; d.setDate(d.getDate()+diff); d.setHours(0,0,0,0); return d; }
function weekKey(date){ const d=startOfWeek(date); return [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-"); }
function weekLabel(key){ const p=key.split("-"); const start=new Date(Number(p[0]), Number(p[1])-1, Number(p[2])); const end=new Date(start); end.setDate(end.getDate()+6); return (start.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}) + " – " + end.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})); }
function monthKey(date){ return (date.getFullYear() + "-" + String(date.getMonth()+1).padStart(2,"0")); }
function monthLabel(key){ const p=key.split("-"); const d=new Date(Number(p[0]), Number(p[1])-1, 1); return d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); }

function numberValue(value){
  if(value===null || value===undefined) return 0;
  let str=String(value).replace(/\s/g,"").replace(/R\$/gi,"");
  if(str.includes(",")) str=str.replace(/\./g,"").replace(",",".");
  else str=str.replace(/[^\d.-]/g,"");
  const n=Number(str); return isNaN(n) ? 0 : n;
}
function getIndicator(row){ return normalizeText(row.indicador); }
function getConsultant(row){ return String(row.consultor || "").trim(); }
function getSegment(row){ return String(row.segmento || "").trim(); }
function getValue(row){ return numberValue(row.valor); }

function filteredRows(){
  return lancamentos.filter(row=>{
      const date=parseDate(row.data); if(!date) return false;
      if(filters.month!=="all" && monthKey(date)!==filters.month) return false;
      if(filters.week!=="all" && weekKey(date)!==filters.week) return false;
      if(filters.segment!=="all" && getSegment(row)!==filters.segment) return false;
      if(filters.consultant!=="all" && getConsultant(row)!==filters.consultant) return false;
      return true;
  });
}

function sumIndicator(rows, indicator){ const target=normalizeText(indicator); return rows.filter(row => getIndicator(row)===target).reduce((total,row)=>total+getValue(row),0); }
function formatNumber(n){ return Number(n||0).toLocaleString("pt-BR"); }
function formatPercent(n){ if(!isFinite(n)) return "0%"; return (n.toFixed(1).replace(".",",") + "%"); }
function conversion(a,b){ if(!a) return 0; return (Number(b||0) / Number(a||0))*100; }
function escapeHTML(value){ return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }

const ICONS={
  prospeccao:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><circle cx="11" cy="11" r="2"/><path d="M16 16l5 5"/></svg>`,
  diagnostico:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/><path d="M8 11l2 2 5-5"/></svg>`,
  validacao:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3z"/><path d="M8 12l2.5 2.5L16 9"/></svg>`,
  apresentacao:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 13l3-3 2 2 4-5"/></svg>`,
  decisorio:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M9 6h3c3 0 3 3 3 5v4"/><path d="M12 12l3 3 3-3"/></svg>`
};

function pageHeader(title, subtitle){ return `<div class="topbar"><div class="title"><h1>${title}</h1><p>${subtitle}</p></div><button class="refresh" onclick="loadData()">↻ Atualizar</button></div>`; }
function statusHTML(){ return `<div class="status"><strong>Conexão ativa</strong> &nbsp;— Lendo ${lancamentos.length} registros ao vivo.</div>`; }
function filtersHTML(showConsultant=false, showGoalPeriod=false){
  return `<div class="filters"><div class="filter"><label>Mês</label><select id="monthFilter"><option value="all">Todos os meses</option></select></div><div class="filter"><label>Semana</label><select id="weekFilter"><option value="all">Todas as semanas</option></select></div><div class="filter"><label>Segmento</label><select id="segmentFilter"><option value="all">Todos os segmentos</option></select></div>${showGoalPeriod ? `<div class="filter"><label>Metas por</label><select id="goalPeriodicityFilter"><option value="mensal">Mensal</option><option value="semanal">Semanal</option><option value="diario">Diário</option></select></div><div class="filter"><label>Período da meta</label><select id="goalPeriodValueFilter"><option value="all">Todos os períodos</option></select></div>` : ""}${showConsultant ? `<div class="filter"><label>Consultor</label><select id="consultantFilter"><option value="all">Todos</option><option value="Matheus">Matheus</option><option value="Edson">Edson</option><option value="Gabriel">Gabriel</option></select></div>` : ""}</div>`;
}

/* GAMIFICAÇÃO */
function rewardForProgress(percent, indicator){
  const t = normalizeText(indicator); let tiers = {};
  if(t.includes("efetivos")) { tiers = { elite: {l: "Máquina de Prospecção", d: "Volume insano de contatos. Elite Prime ✦"}, max: {l: "Mestre da Abordagem", d: "Meta de contatos 100% batida."}, high: {l: "Máquina de Tração", d: "Falta muito pouco para a meta."}, mid: {l: "Radar Ligado", d: "Metade do caminho nos contatos."}, low: {l: "Emissor Ativo", d: "Primeiros contatos realizados."} }; }
  else if (t.includes("agendadas")) { tiers = { elite: {l: "Arquiteto de Oportunidades", d: "Agenda completamente lotada. Nível Elite ✦"}, max: {l: "Dominador de Agenda", d: "Meta de agendamentos 100% atingida."}, high: {l: "Calendário Quente", d: "Quase batendo a meta de agenda."}, mid: {l: "Tração de Agenda", d: "50% dos agendamentos concluídos."}, low: {l: "Agenda Iniciada", d: "Primeiros agendamentos marcados no mês."} }; }
  else if (t.includes("realizadas")) { tiers = { elite: {l: "Linha de Frente", d: "Presença executiva massiva. Elite Prime ✦"}, max: {l: "Execução Impecável", d: "Meta de reuniões realizadas batida."}, high: {l: "Campo de Batalha", d: "Ritmo forte de apresentações diárias."}, mid: {l: "Conexão Estabelecida", d: "Metade das reuniões já aconteceram."}, low: {l: "Presença Marcada", d: "Primeiras reuniões executadas com sucesso."} }; }
  else if (t.includes("qualificadas")) { tiers = { elite: {l: "Fechador de Elite", d: "Altíssima conversão e foco. Nível máximo ✦"}, max: {l: "Sniper Corporativo", d: "Meta de qualificação rigorosamente atingida."}, high: {l: "Mira Laser", d: "Qualificação cirúrgica em nível avançado."}, mid: {l: "Filtro de Ouro", d: "Metade das grandes oportunidades geradas."}, low: {l: "Garimpeiro", d: "Primeiras oportunidades reais validadas."} }; }
  else if (t.includes("contratos")) { tiers = { elite: {l: "Lenda Comercial", d: "Resultados extraordinários e faturamento limpo. Elite Prime ✦"}, max: {l: "Rainmaker", d: "Meta de fechamentos atingida! Impressionante."}, high: {l: "Zona de Conversão", d: "A um único passo de bater a meta de contratos."}, mid: {l: "Aperto de Mão", d: "50% da agressiva meta de contratos garantida."}, low: {l: "Tinta no Papel", d: "Os primeiros fechamentos já estão em casa."} }; }
  else { tiers = { elite: {l: "Elite Prime", d: "Meta superada."}, max: {l: "Meta conquistada", d: "Objetivo atingido."}, high: {l: "Zona de fechamento", d: "Quase lá."}, mid: {l: "Ritmo de ataque", d: "Metade do caminho."}, low: {l: "Aquecendo a máquina", d: "Primeiro marco."} }; }

  if(percent>100) return {label: tiers.elite.l, detail: tiers.elite.d, icon:"✦", unlocked:true, elite:true};
  if(percent>=100) return {label: tiers.max.l, detail: tiers.max.d, icon:"✓", unlocked:true, elite:false};
  if(percent>=75) return {label: tiers.high.l, detail: tiers.high.d, icon:"◆", unlocked:true, elite:false};
  if(percent>=50) return {label: tiers.mid.l, detail: tiers.mid.d, icon:"↗", unlocked:true, elite:false};
  if(percent>=25) return {label: tiers.low.l, detail: tiers.low.d, icon:"◈", unlocked:true, elite:false};
  return {label: "Primeiro marco", detail: "Continue avançando na operação.", icon:"○", unlocked:false, elite:false};
}

/* VISÃO DE TUDO */
function renderOverview(){
  const rows=filteredRows();
  const contatos=sumIndicator(rows, "Contatos Efetivos"), reunioesQualificadas=sumIndicator(rows, "Reuniões Qualificadas"), clientesInteressados=sumIndicator(rows, "Clientes Interessados"), acessosDiretoria=sumIndicator(rows, "Acessos à Diretoria"), propostasApresentadas=sumIndicator(rows, "Propostas Apresentadas"), propostasValidadas=sumIndicator(rows, "Propostas Validadas");
  const conversaoContatoQualificado=conversion(contatos, reunioesQualificadas), conversaoQualificadoInteressado=conversion(reunioesQualificadas, clientesInteressados), conversaoInteressadoDiretoria=conversion(clientesInteressados, acessosDiretoria);
  
  const consultants=["Matheus", "Edson", "Gabriel"];
  const ranking = consultants.map(name => {
    const cRows = rows.filter(row => getConsultant(row) === name);
    const score = (sumIndicator(cRows, "Contatos Efetivos") * 0.5) + (sumIndicator(cRows, "Reuniões Agendadas") * 50) + (sumIndicator(cRows, "Reuniões Realizadas") * 100) + (sumIndicator(cRows, "Reuniões Qualificadas") * 250) + (sumIndicator(cRows, "Contratos") * 1000);
    return { name, value: score };
  }).sort((a, b) => b.value - a.value);

  const avatars={Matheus:{src:"assets/matheus.jpg",emoji:"🏃"},Edson:{src:"assets/edson.jpg",emoji:"😴"},Gabriel:{src:"assets/gabriel.jpg",emoji:"🥷"}};
  
  const rankingHTML = ranking.map((item,index)=>`
    <div class="rank">
      <div class="rank-position">${index+1}º</div>
      <div class="avatar">
         <img class="${item.name.toLowerCase()}" src="${avatars[item.name].src}" alt="${escapeHTML(item.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
         <span style="display:none">${avatars[item.name].emoji}</span>
      </div>
      <div><div class="rank-name">${item.name}</div><div class="rank-value">${formatNumber(item.value)} pontos acumulados</div></div>
    </div>
  `).join("");

  const pipelineHTML=`
    <div class="pipeline-executive">
      <div class="pipeline-step"><div class="pipeline-step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><circle cx="11" cy="11" r="2"/><path d="M16 16l5 5"/></svg></div><div class="pipeline-step-info"><div class="pipeline-step-label">Contatos Efetivos</div><div class="pipeline-step-value">${formatNumber(contatos)}</div><div class="pipeline-step-description">Entrada da operação comercial</div></div></div>
      <div class="pipeline-connector"><div class="pipeline-arrow">↓</div><div class="pipeline-conversion"><strong>${formatPercent(conversaoContatoQualificado)}</strong><span>dos contatos viraram reuniões qualificadas</span></div></div>
      <div class="pipeline-step"><div class="pipeline-step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/><path d="M8 11l2 2 5-5"/></svg></div><div class="pipeline-step-info"><div class="pipeline-step-label">Reuniões Qualificadas</div><div class="pipeline-step-value">${formatNumber(reunioesQualificadas)}</div><div class="pipeline-step-description">Oportunidades qualificadas</div></div></div>
      <div class="pipeline-connector"><div class="pipeline-arrow">↓</div><div class="pipeline-conversion"><strong>${formatPercent(conversaoQualificadoInteressado)}</strong><span>das reuniões qualificadas viraram clientes interessados</span></div></div>
      <div class="pipeline-step"><div class="pipeline-step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2.5-6 6-6"/><circle cx="17" cy="10" r="3"/><path d="M14 20c0-3.5 1.5-6 5-6"/></svg></div><div class="pipeline-step-info"><div class="pipeline-step-label">Clientes Interessados</div><div class="pipeline-step-value">${formatNumber(clientesInteressados)}</div><div class="pipeline-step-description">Interesse comercial confirmado</div></div></div>
      <div class="pipeline-connector"><div class="pipeline-arrow">↓</div><div class="pipeline-conversion"><strong>${formatPercent(conversaoInteressadoDiretoria)}</strong><span>dos interessados chegaram à diretoria</span></div></div>
      <div class="pipeline-step"><div class="pipeline-step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V9l8-5 8 5v12"/><path d="M8 21v-7h8v7"/><path d="M3 21h18"/></svg></div><div class="pipeline-step-info"><div class="pipeline-step-label">Acessos à Diretoria</div><div class="pipeline-step-value">${formatNumber(acessosDiretoria)}</div><div class="pipeline-step-description">Acesso ao decisor</div></div></div>
    </div>
  `;

  return `
    <div class="overview-page">
    ${pageHeader("Visão de Tudo", "Visão consolidada da operação comercial")}
    ${statusHTML()}
    ${filtersHTML(true)} 

    <div class="section">
      <div class="section-head"><h2>Ranking • Pontuação Geral</h2></div>
      <div class="ranking">${rankingHTML}</div>
    </div>

    ${renderOverviewGoals()}

    <div class="grid">
      <div class="card"><div class="card-label">Contatos Efetivos</div><div class="card-value">${formatNumber(contatos)}</div><div class="card-sub">Topo da prospecção</div></div>
      <div class="card"><div class="card-label">Reuniões Qualificadas</div><div class="card-value">${formatNumber(reunioesQualificadas)}</div><div class="card-sub">Base do ranking</div></div>
      <div class="card"><div class="card-label">Propostas Apresentadas</div><div class="card-value">${formatNumber(propostasApresentadas)}</div><div class="card-sub">Avanço executivo</div></div>
      <div class="card"><div class="card-label">Propostas Validadas</div><div class="card-value">${formatNumber(propostasValidadas)}</div><div class="card-sub">${formatPercent(conversion(propostasApresentadas, propostasValidadas))} de validação</div></div>
    </div>

    <div class="section">
      <div class="section-head"><div><h2>Esteira Comercial</h2><div style="margin-top:5px; color:var(--muted); font-size:12px;">Conversão dos principais pontos da operação</div></div></div>
      ${pipelineHTML}
    </div>
    </div>
  `;
}

/* METAS DINÂMICAS */
function formatDateKey(date){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,"0"),String(date.getDate()).padStart(2,"0")].join("-");}
function metaPeriodicity(row){const v=normalizeText(row.periodicidade||row.frequencia||row.tipo||"mensal");return v.includes("diar")?"diario":v.includes("seman")?"semanal":"mensal";}
function getRecurringTarget(indicator, periodicity, consultant) {
  const target = normalizeText(indicator);
  const match = metas.find(row => {
    if(normalizeText(row.indicador) !== target) return false;
    const rc = normalizeText(row.consultor || "");
    const reqC = consultant === "Equipe" ? "equipe" : normalizeText(consultant);
    if(rc !== reqC) return false;
    if(metaPeriodicity(row) !== periodicity) return false;
    return true;
  });
  return match ? numberValue(match.meta) : 0;
}
function goalTargetForConsultant(indicator, periodicity, key, consultant) {
  const baseTarget = getRecurringTarget(indicator, periodicity, consultant);
  if (!baseTarget) return 0;
  if (key === "all") {
    const uniquePeriods = new Set();
    lancamentos.forEach(row => {
      const d = parseDate(row.data);
      if(d) {
        if(periodicity === "mensal") uniquePeriods.add(monthKey(d));
        else if(periodicity === "semanal") uniquePeriods.add(weekKey(d));
        else uniquePeriods.add(formatDateKey(d));
      }
    });
    return baseTarget * (uniquePeriods.size > 0 ? uniquePeriods.size : 1); 
  }
  return baseTarget;
}
function goalTarget(indicator,periodicity,key){return goalTargetForConsultant(indicator,periodicity,key,filters.consultant==="all"?"Equipe":filters.consultant);}
function goalActualRows(periodicity,key,consultantOverride=null){return lancamentos.filter(row=>{const d=parseDate(row.data);if(!d)return false;if(filters.segment!=="all"&&getSegment(row)!==filters.segment)return false;if(consultantOverride){if(getConsultant(row)!==consultantOverride)return false;}else if(filters.consultant!=="all"&&getConsultant(row)!==filters.consultant)return false;if(periodicity==="mensal")return key==="all"||monthKey(d)===key;if(periodicity==="semanal")return key==="all"||weekKey(d)===key;return key==="all"||formatDateKey(d)===key;});}
function goalPeriodLabel(periodicity,key){if(key==="all")return periodicity==="mensal"?"Todos os meses":periodicity==="semanal"?"Todas as semanas":"Todos os dias";if(periodicity==="mensal")return monthLabel(key);if(periodicity==="semanal")return weekLabel(key);return new Date(key+"T00:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});}
function goalMilestones(percent){return [25,50,75,100].map(mark=>`<span class="goal-milestone ${percent>=mark?"done":""}" style="left:${mark}%"><span class="goal-milestone-label">${mark}%</span></span>`).join("");}

function goalCard(indicator,rows,periodicity,key,label,consultant=null){
  const actual=sumIndicator(rows,indicator),target=consultant?goalTargetForConsultant(indicator,periodicity,key,consultant):goalTarget(indicator,periodicity,key);
  const percent=target?(actual/target)*100:0,width=Math.min(percent,100),reward=rewardForProgress(percent, indicator);
  const cardClass=reward.elite?"goal-card goal-elite":reward.unlocked?"goal-card goal-achieved":"goal-card";
  const rewardClass=reward.elite?"goal-reward unlocked elite":reward.unlocked?"goal-reward unlocked":"goal-reward";
  return `<div class="${cardClass}"><div class="goal-top"><div><div class="goal-label">${escapeHTML(indicator)}</div><div class="goal-period">${escapeHTML(label)}</div></div><div class="goal-percent-badge">${target?formatPercent(percent):"—"}</div></div><div class="goal-numbers"><span class="goal-current">${formatNumber(actual)}</span><span class="goal-target">/ ${target?formatNumber(target):"meta não cadastrada"}</span></div><div class="goal-progress-wrap"><div class="goal-milestones">${goalMilestones(percent)}</div><div class="goal-bar"><div class="goal-fill" style="width:${width}%"></div></div></div><div class="${rewardClass}"><div class="goal-reward-icon">${reward.icon}</div><div><span>${reward.unlocked?"Recompensa desbloqueada":"Próxima recompensa"}</span><strong>${escapeHTML(reward.label)}</strong></div></div></div>`;
}

function consultantAvatar(name){
    const file = name.toLowerCase() + ".jpg"; 
    const cssClass = name.toLowerCase();
    return `<img class="${cssClass}" src="assets/${file}" alt="${escapeHTML(name)}" onerror="this.style.display='none';this.parentElement.textContent='${name[0]}'">`;
}

function consultantGoalMini(indicator,consultant,rows,periodicity,key){
  const actual=sumIndicator(rows,indicator),target=goalTargetForConsultant(indicator,periodicity,key,consultant),percent=target?(actual/target)*100:0,width=Math.min(percent,100);
  const elite=percent>100,done=percent>=100;
  return `<div class="mini-goal"><div class="mini-goal-top"><span class="mini-goal-name">${escapeHTML(indicator)}</span><span class="mini-goal-percent">${target?formatPercent(percent):"—"}</span></div><div class="mini-goal-bar"><div class="mini-goal-fill ${elite?"elite":done?"done":""}" style="width:${width}%"></div></div><div class="mini-goal-values"><span>${formatNumber(actual)} realizado</span><strong>${target?"Meta "+formatNumber(target):"Sem meta"}</strong></div></div>`;
}

function renderIndividualGoals(periodicity,key,label){
  let indicators = ["Contatos Efetivos", "Reuniões Agendadas"];
  if (periodicity === "semanal" || periodicity === "mensal") indicators.push("Reuniões Realizadas", "Reuniões Qualificadas");
  if (periodicity === "mensal") indicators.push("Contratos");
  const consultants=["Edson","Gabriel","Matheus"];
  return `<div class="individual-goals"><div class="individual-goals-head"><h3>Metas Individuais</h3><span>${escapeHTML(label)} • visão por consultor</span></div><div class="individual-goals-grid">${consultants.map(name=>{const rows=goalActualRows(periodicity,key,name);const selected=filters.consultant===name;return `<div class="consultant-goal-card ${selected?"selected":""}"><div class="consultant-goal-head"><div class="consultant-goal-avatar">${consultantAvatar(name)}</div><div><div class="consultant-goal-name">${name}</div><div class="consultant-goal-role">Consultor</div></div></div>${indicators.map(i=>consultantGoalMini(i,name,rows,periodicity,key)).join("")}</div>`;}).join("")}</div></div>`;
}

function renderOverviewGoals(){
  const periodicity=goalFilters.periodicity||"mensal",key=goalFilters.period||"all",rows=goalActualRows(periodicity,key),label=goalPeriodLabel(periodicity,key);
  let indicators = ["Contatos Efetivos", "Reuniões Agendadas"];
  if (periodicity === "semanal" || periodicity === "mensal") indicators.push("Reuniões Realizadas", "Reuniões Qualificadas");
  if (periodicity === "mensal") indicators.push("Contratos");
  
  return `<div class="section goals-section"><div class="goals-head"><div class="goals-title-wrap"><div class="goals-kicker"><span class="goals-kicker-dot"></span>Performance Comercial</div><h2>Metas da Operação</h2><div class="goals-subtitle">Meta da equipe em destaque e, abaixo, a performance individual dos consultores.</div></div><div class="goal-controls"><div class="goal-period-switch"><button type="button" class="goal-period-btn ${periodicity==="diario"?"active":""}" data-goal-periodicity="diario">Diário</button><button type="button" class="goal-period-btn ${periodicity==="semanal"?"active":""}" data-goal-periodicity="semanal">Semanal</button><button type="button" class="goal-period-btn ${periodicity==="mensal"?"active":""}" data-goal-periodicity="mensal">Mensal</button></div><select id="goalPeriodValueFilter" class="goal-period-select"><option value="all">${escapeHTML(label)}</option></select></div></div><div class="goal-context"><div class="goal-context-period"><span>PERÍODO</span>${escapeHTML(label)}</div><div class="goal-context-status">${periodicity==="diario"?"Meta diária":periodicity==="semanal"?"Meta semanal":"Meta mensal"}</div></div><div class="team-goals-grid">${indicators.map(i=>goalCard(i,rows,periodicity,key,label)).join("")}</div>${renderIndividualGoals(periodicity,key,label)}</div>`;
}

/* STAGE CARDS */
const STAGES={
  prospeccao:{title:"Prospecção Inicial",description:"Eficiência da geração e qualificação de reuniões.",icon:"prospeccao",indicators:["Contatos Efetivos","Reuniões Agendadas","Reuniões Confirmadas","Reuniões Qualificadas"]},
  diagnostico:{title:"Diagnóstico Estratégico",description:"Evolução dos clientes interessados até o acesso à diretoria.",icon:"diagnostico",indicators:["Clientes Interessados","Diagnósticos Concluídos","Acessos à Diretoria"]},
  validacao:{title:"Validação Executiva",description:"Engajamento das diretorias, prioridades e propostas.",icon:"validacao",indicators:["Diretorias Engajadas","Prioridades Mapeadas","Propostas Apresentadas"]},
  apresentacao:{title:"Apresentação Executiva",description:"Acompanhamento das propostas validadas.",icon:"apresentacao",indicators:["Propostas Validadas"]},
  decisorio:{title:"Processo Decisório",description:"Identificação e saneamento das objeções.",icon:"decisorio",indicators:["Objeções Identificadas","Objeções Sanadas"]}
};

function renderStage(page){
  const stage=STAGES[page]; const rows=filteredRows();
  const values=stage.indicators.map(indicator=>({indicator,value:sumIndicator(rows,indicator)}));
  let cards="";
  values.forEach((item,index)=>{
      let conversionHTML="";
      if(index<values.length-1){
        const next=values[index+1];
        conversionHTML=`<div class="stage-conversion">Conversão para ${next.indicator}: <strong>${formatPercent(conversion(item.value,next.value))}</strong></div>`;
      }
      cards+=`<div class="stage-card"><div class="stage-icon">${ICONS[stage.icon]}</div><h3>${item.indicator}</h3><div class="stage-number">${formatNumber(item.value)}</div>${conversionHTML}</div>`;
  });
  return `${pageHeader(stage.title,stage.description)}${statusHTML()}${filtersHTML(page==="prospeccao" || page==="diagnostico" || page==="apresentacao")}<div class="stage-grid">${cards}</div>`;
}

/* METAS TABELA */
function renderMetas(){
  return `${pageHeader("Metas","Metas da equipe e dos consultores por ritmo de acompanhamento")}
    <div class="section"><div class="section-head"><div><h2>Metas cadastradas</h2><div style="margin-top:5px;color:var(--muted);font-size:12px">Lendo metas fixas recorrentes da planilha.</div></div></div>
      <div class="table-wrap"><table><thead><tr><th>Periodicidade</th><th>Consultor</th><th>Indicador</th><th>Meta</th></tr></thead>
          <tbody>${metas.length?metas.map(row=>`<tr><td>${escapeHTML(row.periodicidade||row.frequencia||row.tipo||"Mensal")}</td><td>${escapeHTML(row.consultor||"")}</td><td>${escapeHTML(row.indicador||"")}</td><td>${formatNumber(numberValue(row.meta))}</td></tr>`).join(""):`<tr><td colspan="4">Nenhuma meta encontrada.</td></tr>`}</tbody>
        </table></div></div>`;
}

/* CONSULTORES */
function renderConsultores(){
  const consultants=[
    {name:"Matheus",avatar:"assets/matheus.jpg", fallback:"🏃"},
    {name:"Edson",avatar:"assets/edson.jpg", fallback:"😴"},
    {name:"Gabriel",avatar:"assets/gabriel.jpg", fallback:"🥷"}
  ];
  return `${pageHeader("Consultores","Equipe comercial")}
    <div class="stage-grid">
      ${consultants.map(consultant=>`
        <div class="stage-card" style="text-align:center">
          <div class="avatar" style="width:90px;height:90px;margin:auto;font-size:42px;">
            <img class="${consultant.name.toLowerCase()}" src="${consultant.avatar}" alt="${escapeHTML(consultant.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
            <span style="display:none">${consultant.fallback}</span>
          </div>
          <h3>${consultant.name}</h3><div class="card-sub">Consultor</div>
        </div>
      `).join("")}
    </div>`;
}

/* NAVEGAÇÃO E EVENTOS */
function bindSidebar() {
  const toggleBtn = document.getElementById("sidebarToggle");
  if (toggleBtn && !toggleBtn.dataset.bound) {
    toggleBtn.dataset.bound = "true";
    toggleBtn.addEventListener("click", () => document.body.classList.toggle("sidebar-collapsed"));
  }
  const sidebarNav = document.querySelector('.sidebar');
  if(sidebarNav && !sidebarNav.dataset.bound) {
    sidebarNav.dataset.bound = "true";
    sidebarNav.addEventListener("click", (e) => {
      const btn = e.target.closest('.nav[data-page]');
      if(btn) {
        const page = btn.getAttribute("data-page");
        if (page && page !== currentPage) {
          currentPage = page; updateActiveMenu(); render();
        }
      }
    });
  }
}
function updateActiveMenu() {
  document.querySelectorAll(".nav[data-page]").forEach(btn => {
    if (btn.getAttribute("data-page") === currentPage) btn.classList.add("active");
    else btn.classList.remove("active");
  });
}

/* RENDER E FILTROS */
function render(){
  const app=document.getElementById("app");
  if(currentPage==="overview") app.innerHTML=renderOverview();
  else if(STAGES[currentPage]) app.innerHTML=renderStage(currentPage);
  else if(currentPage==="metas") app.innerHTML=renderMetas();
  else if(currentPage==="consultores") app.innerHTML=renderConsultores();
  
  bindFilters(); populateFilters(); bindSidebar(); updateActiveMenu();
}

function populateFilters(){
  const months=new Set(), weeks=new Set(), segments=new Set();
  lancamentos.forEach(row=>{
      const date=parseDate(row.data);
      if(date){ months.add(monthKey(date)); weeks.add(weekKey(date)); }
      if(getSegment(row)) segments.add(getSegment(row));
  });

  const monthSelect=document.getElementById("monthFilter");
  if(monthSelect){
    monthSelect.innerHTML=`<option value="all">Todos os meses</option>`+[...months].sort().map(month=>`<option value="${month}">${monthLabel(month)}</option>`).join("");
    if(filters.month === "all" && months.has(monthKey(new Date()))) { filters.month = monthKey(new Date()); }
    monthSelect.value=filters.month;
  }

  const weekSelect=document.getElementById("weekFilter");
  if(weekSelect){
    let availableWeeks=[...weeks];
    if(filters.month!=="all"){
      availableWeeks=availableWeeks.filter(week=>{
        const p=week.split("-"); const date=new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
        return (monthKey(date)===filters.month);
      });
    }
    weekSelect.innerHTML=`<option value="all">Todas as semanas</option>`+availableWeeks.sort().map(week=>`<option value="${week}">${weekLabel(week)}</option>`).join("");
    weekSelect.value=filters.week;
  }

  const segmentSelect=document.getElementById("segmentFilter");
  if(segmentSelect){ segmentSelect.innerHTML=`<option value="all">Todos os segmentos</option>`+[...segments].sort().map(segment=>`<option value="${escapeHTML(segment)}">${escapeHTML(segment)}</option>`).join(""); segmentSelect.value=filters.segment; }

  const goalPeriodValueSelect=document.getElementById("goalPeriodValueFilter");
  if(goalPeriodValueSelect){
    const periodicity=goalFilters.periodicity||"mensal"; const values=new Set();
    lancamentos.forEach(row=>{ const d=parseDate(row.data); if(!d)return; values.add(periodicity==="mensal"?monthKey(d):periodicity==="semanal"?weekKey(d):formatDateKey(d)); });
    const sorted=[...values].sort();
    goalPeriodValueSelect.innerHTML=`<option value="all">${periodicity==="mensal"?"Todos os meses":periodicity==="semanal"?"Todas as semanas":"Todos os dias"}</option>`+sorted.map(v=>{const label=periodicity==="mensal"?monthLabel(v):periodicity==="semanal"?weekLabel(v):new Date(v+"T00:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});return `<option value="${v}">${escapeHTML(label)}</option>`;}).join("");
    if(goalFilters.period==="all"){
      const current = periodicity==="mensal"?monthKey(new Date()):periodicity==="semanal"?weekKey(new Date()):formatDateKey(new Date());
      if(values.has(current)) goalFilters.period = current;
    }
    if(goalFilters.period!=="all"&&!sorted.includes(goalFilters.period))goalFilters.period="all";
    goalPeriodValueSelect.value=goalFilters.period;
  }

  const consultantSelect=document.getElementById("consultantFilter");
  if(consultantSelect)consultantSelect.value=filters.consultant;
}

function bindFilters(){
  const month=document.getElementById("monthFilter"); if(month)month.addEventListener("change",event=>{filters.month=event.target.value;filters.week="all";render();});
  const week=document.getElementById("weekFilter"); if(week)week.addEventListener("change",event=>{filters.week=event.target.value;render();});
  const segment=document.getElementById("segmentFilter"); if(segment)segment.addEventListener("change",event=>{filters.segment=event.target.value;render();});
  const consultant=document.getElementById("consultantFilter"); if(consultant)consultant.addEventListener("change",event=>{filters.consultant=event.target.value;render();});
  document.querySelectorAll("[data-goal-periodicity]").forEach(button=>{ button.addEventListener("click",()=>{goalFilters.periodicity=button.dataset.goalPeriodicity;goalFilters.period="all";render();}); });
  const goalPeriodValueSelect=document.getElementById("goalPeriodValueFilter"); if(goalPeriodValueSelect)goalPeriodValueSelect.addEventListener("change",event=>{goalFilters.period=event.target.value;render();});
}

/* INICIAR O SISTEMA */
loadData();
</script>
</body>
</html>
